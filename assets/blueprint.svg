<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="Robotic arm blueprint drawing itself line by line">
<defs>
<style><![CDATA[
  .ln   { fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .grid { stroke:#131327; stroke-width:1; }
  .st   { stroke:#7dd3fc; stroke-width:2.4; }
  .thin { stroke:#7dd3fc; stroke-width:1.4; }
  .dim  { stroke:#3f4b63; stroke-width:1; }
  .arc  { stroke:#a78bfa; stroke-width:1.4; stroke-dasharray:6 7; opacity:.55; }
  .jt   { fill:#060610; stroke:#a78bfa; stroke-width:2.4; }
  .tx   { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill:#8b98ad; }
  .lbl  { font-size:12px; letter-spacing:.08em; }
  .big  { font-size:19px; fill:#c3cede; letter-spacing:.02em; }
  .acc  { fill:#a78bfa; }
  .mut  { font-size:11px; fill:#4d5972; letter-spacing:.18em; }

  [class*="d-"] { stroke-dasharray:100; stroke-dashoffset:100; animation-duration:14s; animation-iteration-count:infinite; animation-timing-function:cubic-bezier(.4,0,.2,1); }
  [class*="f-"], .typ { animation-duration:14s; animation-iteration-count:infinite; animation-timing-function:ease; }

  .d-1 { animation-name:d1 } .d-2 { animation-name:d2 } .d-3 { animation-name:d3 } .d-4 { animation-name:d4 }
  .f-0 { animation-name:f0 } .f-1 { animation-name:f1 } .f-2 { animation-name:f2 }
  .t-1 { animation-name:t1 } .t-2 { animation-name:t2 } .t-3 { animation-name:t3 }
  .cur { animation:blink 1s steps(1) infinite, f2 14s ease infinite }

  @keyframes d1 { 0%,4%{stroke-dashoffset:100} 19%,95%{stroke-dashoffset:0;opacity:1} 100%{stroke-dashoffset:0;opacity:0} }
  @keyframes d2 { 0%,17%{stroke-dashoffset:100} 37%,95%{stroke-dashoffset:0;opacity:1} 100%{stroke-dashoffset:0;opacity:0} }
  @keyframes d3 { 0%,44%{stroke-dashoffset:100} 58%,95%{stroke-dashoffset:0;opacity:1} 100%{stroke-dashoffset:0;opacity:0} }
  @keyframes d4 { 0%,52%{stroke-dashoffset:100} 64%,95%{stroke-dashoffset:0;opacity:1} 100%{stroke-dashoffset:0;opacity:0} }
  @keyframes f0 { 0%{opacity:0} 5%,95%{opacity:1} 100%{opacity:0} }
  @keyframes f1 { 0%,36%{opacity:0} 46%,95%{opacity:1} 100%{opacity:0} }
  @keyframes f2 { 0%,56%{opacity:0} 66%,95%{opacity:1} 100%{opacity:0} }
  @keyframes t1 { 0%,60%{transform:scaleX(0)} 71%,95%{transform:scaleX(1)} 100%{transform:scaleX(1)} }
  @keyframes t2 { 0%,69%{transform:scaleX(0)} 79%,95%{transform:scaleX(1)} 100%{transform:scaleX(1)} }
  @keyframes t3 { 0%,77%{transform:scaleX(0)} 88%,95%{transform:scaleX(1)} 100%{transform:scaleX(1)} }
  @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }

  .typ { transform:scaleX(0); }
  #m1 rect,#m2 rect,#m3 rect { transform-origin:560px 0; }
]]></style>

<mask id="m1"><rect class="typ t-1" x="560" y="120" width="330" height="26" fill="#fff"/></mask>
<mask id="m2"><rect class="typ t-2" x="560" y="152" width="330" height="26" fill="#fff"/></mask>
<mask id="m3"><rect class="typ t-3" x="560" y="184" width="330" height="26" fill="#fff"/></mask>
</defs>

<rect width="900" height="340" fill="#060610"/>

<g class="ln grid f-0">
  <path d="M0 40H900M0 80H900M0 120H900M0 160H900M0 200H900M0 240H900M0 280H900M0 320H900"/>
  <path d="M40 0V340M80 0V340M120 0V340M160 0V340M200 0V340M240 0V340M280 0V340M320 0V340M360 0V340M400 0V340M440 0V340M480 0V340M520 0V340"/>
</g>

<path class="ln arc d-3" pathLength="100" d="M34 224 Q 190 -34 402 128"/>

<g class="ln st">
  <path class="d-1" pathLength="100" d="M150 292 H240 V308 H150 Z"/>
  <path class="d-1" pathLength="100" d="M195 292 V196"/>
  <path class="d-2" pathLength="100" d="M195 190 L322 126"/>
  <path class="d-2" pathLength="100" d="M322 126 L448 158"/>
  <path class="d-2" pathLength="100" d="M448 158 L492 139 M448 158 L492 177 M492 139 L502 146 M492 177 L502 170"/>
</g>

<g class="ln thin d-1" pathLength="100" opacity=".5">
  <path d="M152 308 L142 320 M170 308 L160 320 M188 308 L178 320 M206 308 L196 320 M224 308 L214 320 M240 308 L230 320"/>
</g>

<g class="f-1">
  <circle class="jt" cx="195" cy="190" r="11"/>
  <circle class="jt" cx="322" cy="126" r="9"/>
  <circle class="jt" cx="448" cy="158" r="8"/>
  <circle cx="195" cy="190" r="3" fill="#a78bfa"/>
  <circle cx="322" cy="126" r="2.5" fill="#a78bfa"/>
  <circle cx="448" cy="158" r="2.5" fill="#a78bfa"/>
</g>

<g class="ln dim d-4" pathLength="100">
  <path d="M150 324 H240 M150 318 V330 M240 318 V330"/>
  <path d="M128 196 V292 M122 196 H134 M122 292 H134"/>
</g>

<g class="tx lbl f-2">
  <text x="212" y="184" class="acc">J1</text>
  <text x="337" y="120" class="acc">J2</text>
  <text x="462" y="152" class="acc">J3</text>
  <text x="186" y="336" class="mut" font-size="10">90</text>
  <text x="96"  y="248" class="mut" font-size="10">h</text>
  <text x="510" y="132" class="mut">EEF</text>
</g>

<path class="ln dim d-4" pathLength="100" d="M530 96 V244"/>

<g class="tx">
  <text x="560" y="86" class="mut f-2">// KINEMATIC CHAIN · 3R</text>
  <text x="560" y="140" class="big" mask="url(#m1)">arseniy · itmo robotics &amp; ai</text>
  <text x="560" y="172" class="big" mask="url(#m2)">data engineering → ml</text>
  <text x="560" y="204" class="big acc" mask="url(#m3)">periculum in mora</text>
  <rect class="cur" x="752" y="192" width="11" height="2" fill="#a78bfa"/>
</g>
</svg>
