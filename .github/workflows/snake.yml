name: generate snake animation

on:
  # дергаем раз в сутки
  schedule:
    - cron: "0 0 * * *"
  # чтобы можно было запустить руками
  workflow_dispatch:
  # ну и при пуше
  push:
    branches:
    - master
    - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # генерим саму змейку
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#c084fc&color_dots=#161b22,#2b0a3d,#4c1d6e,#7b3fb0,#b07cf0
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#c084fc&color_dots=#161b22,#2b0a3d,#4c1d6e,#7b3fb0,#b07cf0

      # пушим картинки в отдельную ветку
      - name: push svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
